version = 1

[envs.nushell]
channels = ["conda-forge"]
dependencies = { nushell = "*" }
exposed = { nu = "nu" }

[envs.uutils-coreutils]
channels = ["conda-forge"]
# Its own env (matches the linux manifest). Provides a real `ln` (Rust std
# symlink) — Nushell has no native symlink primitive and Windows lacks `ln` on
# PATH. dots.nu aliases `ln = coreutils ln`, so this is load-bearing for sync.
dependencies = { uutils-coreutils = "*" }
exposed = { coreutils = "coreutils" }

[envs.gh]
channels = ["conda-forge"]
dependencies = { gh = "*" }
exposed = { gh = "gh" }

[envs.ripgrep]
channels = ["conda-forge"]
dependencies = { ripgrep = "*" }
exposed = { rg = "rg" }

[envs.tree-sitter-cli]
channels = ["conda-forge"]
dependencies = { tree-sitter-cli = "*" }
exposed = { tree-sitter = "tree-sitter" }

[envs.bottom]
channels = ["conda-forge"]
dependencies = { bottom = "*" }
exposed = { btm = "btm" }

[envs.lazygit]
channels = ["conda-forge"]
dependencies = { lazygit = "*" }
exposed = { lazygit = "lazygit" }

[envs.fzf]
channels = ["conda-forge"]
dependencies = { fzf = "*" }
exposed = { fzf = "fzf" }

# Note: unzip removed - not available on win-64, Windows has built-in zip support

[envs.fd-find]
channels = ["conda-forge"]
dependencies = { fd-find = "*" }
exposed = { fd = "fd" }

[envs.mdformat]
