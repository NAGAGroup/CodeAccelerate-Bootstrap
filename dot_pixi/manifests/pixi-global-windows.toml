[envs.nvim]
channels = ["conda-forge"]
dependencies = { nvim = "*" }
exposed = { nvim = "nvim" }

[envs.compilers]
channels = ["conda-forge"]
# See the linux manifest for the full rationale. On Windows the c/cxx-compiler
# packages are activation scripts for the MSVC toolchain, so `nu-dev`/`nvim-dev`
# inherit MSVC on PATH when invoked. Exposes ONLY the trampolines — no
# cargo/rustc/openssl/perl leaks onto the global PATH.
dependencies = { rust = "*", openssl = "*", perl = "*", cxx-compiler = "*", c-compiler = "*", nushell = "*", nvim = "*" }
exposed = { nu-dev = "nu", nvim-dev = "nvim" }

[envs.git]
channels = ["conda-forge"]
dependencies = { git = "*" }
exposed = { bash = "bash", git = "git", sh = "sh", grep = "grep" }

[envs.pixi-pack]
channels = ["conda-forge"]
dependencies = { pixi-pack = "*" }
exposed = { pixi-pack = "pixi-pack" }

# Note: jq removed - not available on win-64, install via scoop instead
